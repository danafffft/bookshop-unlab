services:
  - type: web
    name: cherry-books
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: ASPNETCORE_URLS
        value: http://127.0.0.1:5080
      - key: API_URL
        value: http://127.0.0.1:5080
      - key: WEB_ROOT
        value: /app/web
